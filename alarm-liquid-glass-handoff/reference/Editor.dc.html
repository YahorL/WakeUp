<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New alarm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#08080C}
a{color:#fff}a:hover{color:#fff}
input::placeholder{color:rgba(255,255,255,0.45)}
@keyframes knobOn{0%{transform:translateX(0) scaleX(1)}45%{transform:translateX(9px) scaleX(1.42)}75%{transform:translateX(24px) scaleX(.92)}100%{transform:translateX(22px) scaleX(1)}}
@keyframes knobOff{0%{transform:translateX(22px) scaleX(1)}45%{transform:translateX(13px) scaleX(1.42)}75%{transform:translateX(-2px) scaleX(.92)}100%{transform:translateX(0) scaleX(1)}}
@keyframes ringOn{0%{box-shadow:0 0 0 0 currentColor;opacity:.75}100%{box-shadow:0 0 0 14px currentColor;opacity:0}}
@keyframes iconPop{0%{transform:scale(.8) rotate(-8deg)}55%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
@keyframes iconDrop{0%{transform:scale(1)}45%{transform:scale(.86)}100%{transform:scale(1)}}
@keyframes tickRise{0%{transform:scaleY(0);opacity:0}100%{transform:scaleY(1);opacity:1}}
@keyframes dotPop{0%{transform:scaleX(0);opacity:0}100%{transform:scaleX(1);opacity:1}}
@keyframes bumpA{0%{transform:translateY(8px) scale(.9);opacity:.2}100%{transform:none;opacity:1}}
@keyframes bumpB{0%{transform:translateY(8px) scale(.9);opacity:.2}100%{transform:none;opacity:1}}
@keyframes dayOn{0%{transform:scale(.78)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes dayOff{0%{transform:scale(1)}45%{transform:scale(.84)}100%{transform:scale(1)}}
@keyframes rollUpA{0%{transform:translateY(34px);opacity:0;filter:blur(4px)}100%{transform:none;opacity:1;filter:none}}
@keyframes rollUpB{0%{transform:translateY(34px);opacity:0;filter:blur(4px)}100%{transform:none;opacity:1;filter:none}}
@keyframes rollDnA{0%{transform:translateY(-34px);opacity:0;filter:blur(4px)}100%{transform:none;opacity:1;filter:none}}
@keyframes rollDnB{0%{transform:translateY(-34px);opacity:0;filter:blur(4px)}100%{transform:none;opacity:1;filter:none}}
@keyframes riseIn{0%{opacity:0;transform:translateY(16px) scale(.98)}100%{opacity:1;transform:none}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.55}}
@keyframes pressBumpA{0%{transform:translateY(8px) scale(.9);opacity:.2}100%{transform:none;opacity:1}}
@keyframes pressBumpB{0%{transform:translateY(8px) scale(.9);opacity:.2}100%{transform:none;opacity:1}}
button:active,a:active{transform:scale(.96)!important}
button,a{transition-property:transform,background,box-shadow,color,opacity;transition-duration:.15s}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div style="width: 390px; height: 1340px; position: relative; overflow: hidden; background: #08080C; font-family: 'Outfit', system-ui, sans-serif; color: #FFFFFF; box-sizing: border-box">

  <div aria-hidden="true" style="position: absolute; width: 440px; height: 440px; top: -140px; left: -120px; border-radius: 50%; background: radial-gradient(circle, {{o1}} 0%, transparent 66%); opacity: {{glow}}; filter: blur(10px)"></div>
  <div aria-hidden="true" style="position: absolute; width: 380px; height: 380px; top: 60px; right: -200px; border-radius: 50%; background: radial-gradient(circle, {{o2}} 0%, transparent 66%); opacity: {{glow}}; filter: blur(10px)"></div>
  <div aria-hidden="true" style="position: absolute; width: 420px; height: 420px; top: 620px; left: -220px; border-radius: 50%; background: radial-gradient(circle, {{o3}} 0%, transparent 66%); opacity: {{glowLow}}; filter: blur(14px)"></div>
  <div aria-hidden="true" style="position: absolute; width: 420px; height: 420px; top: 860px; right: -220px; border-radius: 50%; background: radial-gradient(circle, {{o1}} 0%, transparent 66%); opacity: {{glowLow}}; filter: blur(14px)"></div>
  <sc-if value="{{texGrain}}" hint-placeholder-val="{{ true }}">
    <svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; opacity: 0.22; mix-blend-mode: overlay; pointer-events: none"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
  </sc-if>
  <sc-if value="{{texLines}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 14px); -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 60%); mask-image: linear-gradient(180deg, #000 0%, transparent 60%)"></div>
  </sc-if>

  <div style="position: relative; display: flex; flex-direction: column; padding: 52px 20px 36px; box-sizing: border-box; height: 100%">

    <div style="display: flex; align-items: center; justify-content: space-between; animation: riseIn .6s cubic-bezier(.2,.8,.2,1) 0ms backwards">
      <a href="Main.dc.html" aria-label="Back to alarms" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #fff; text-decoration: none; background: linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04)); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18)">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 18px; font-weight: 500; letter-spacing: -0.01em">New alarm</h1>
      <button type="button" aria-label="Delete alarm" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; background: linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04)); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18)">
        <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"></path></svg>
      </button>
    </div>

    <section aria-label="Time" style="animation: riseIn .7s cubic-bezier(.2,.8,.2,1) 80ms backwards; margin-top: 20px; position: relative; border-radius: 32px; padding: 14px 16px 18px; background: linear-gradient(160deg, rgba(255,255,255,0.13) 0%, rgba(255,255,255,0.035) 60%, rgba(255,255,255,0.06) 100%); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 30px 60px -30px rgba(0,0,0,0.7)">
      <div aria-hidden="true" style="position: absolute; left: 14px; right: 14px; top: 72px; height: 92px; border-radius: 22px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.10); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12)"></div>
      <div style="position: relative; display: flex; align-items: center; justify-content: center; gap: 6px">
        <div style="display: flex; flex-direction: column; align-items: center; width: 130px">
          <button type="button" aria-label="Earlier hour" onClick="{{hourPrev}}" style="height: 58px; width: 100%; border: 0; background: transparent; color: rgba(255,255,255,0.32); font-family: inherit; font-size: 40px; font-weight: 200; cursor: pointer; font-variant-numeric: tabular-nums">{{hPrev}}</button>
          <div style="height: 92px; display: flex; align-items: center; font-size: 88px; font-weight: 200; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums"><span style="display: inline-block; {{hAnim}}">{{hNow}}</span></div>
          <button type="button" aria-label="Later hour" onClick="{{hourNext}}" style="height: 58px; width: 100%; border: 0; background: transparent; color: rgba(255,255,255,0.32); font-family: inherit; font-size: 40px; font-weight: 200; cursor: pointer; font-variant-numeric: tabular-nums">{{hNext}}</button>
        </div>
        <div aria-hidden="true" style="font-size: 72px; font-weight: 200; line-height: 1; margin-top: -8px; color: rgba(255,255,255,0.7)">:</div>
        <div style="display: flex; flex-direction: column; align-items: center; width: 130px">
          <button type="button" aria-label="Earlier minute" onClick="{{minPrev}}" style="height: 58px; width: 100%; border: 0; background: transparent; color: rgba(255,255,255,0.32); font-family: inherit; font-size: 40px; font-weight: 200; cursor: pointer; font-variant-numeric: tabular-nums">{{mPrev}}</button>
          <div style="height: 92px; display: flex; align-items: center; font-size: 88px; font-weight: 200; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums"><span style="display: inline-block; {{mAnim}}">{{mNow}}</span></div>
          <button type="button" aria-label="Later minute" onClick="{{minNext}}" style="height: 58px; width: 100%; border: 0; background: transparent; color: rgba(255,255,255,0.32); font-family: inherit; font-size: 40px; font-weight: 200; cursor: pointer; font-variant-numeric: tabular-nums">{{mNext}}</button>
        </div>
      </div>
      <div style="position: relative; margin-top: 4px; display: flex; justify-content: center">
        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; font-size: 13px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12)">
          <span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: {{o2}}; box-shadow: 0 0 10px {{o2}}; animation: breathe 2.4s ease-in-out infinite"></span>
          <span style="display: inline-block; {{ringsAnim}}">{{ringsIn}}</span>
        </span>
      </div>
    </section>

    <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 8px; animation: riseIn .6s cubic-bezier(.2,.8,.2,1) 160ms backwards">
      <label for="alarm-label" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.62)">Label</label>
      <input id="alarm-label" type="text" value="Wake up" placeholder="Alarm name" style="height: 56px; box-sizing: border-box; padding: 0 18px; border-radius: 20px; font-family: inherit; font-size: 17px; color: #fff; outline: none; background: linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03)); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12)">
    </div>

    <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px; animation: riseIn .6s cubic-bezier(.2,.8,.2,1) 220ms backwards">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.62)">Repeat</span>
        <span style="font-size: 13px; color: rgba(255,255,255,0.62); display: inline-block; {{daysLabelAnim}}">{{daysLabel}}</span>
      </div>
      <div role="group" aria-label="Repeat days" style="display: flex; justify-content: space-between">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <button type="button" aria-label="{{d.name}}" aria-pressed="{{d.pressed}}" onClick="{{d.toggle}}" style="width: 46px; height: 46px; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 500; color: #fff; cursor: pointer; transition: background .2s, box-shadow .2s; {{d.style}}">{{d.letter}}</button>
        </sc-for>
      </div>
    </div>

    <div style="margin-top: 28px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.62)">To turn it off</div>

    <section aria-label="Squats challenge" style="animation: riseIn .6s cubic-bezier(.2,.8,.2,1) 300ms backwards; margin-top: 10px; border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 0; background: linear-gradient(160deg, rgba(255,255,255,0.11), rgba(255,255,255,0.03)); border: 1px solid rgba(255,255,255,0.13); backdrop-filter: blur(26px) saturate(150%); -webkit-backdrop-filter: blur(26px) saturate(150%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16)">
      <div style="display: flex; align-items: center; gap: 14px">
        <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .35s ease, box-shadow .35s ease; {{squatIconStyle}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"></path></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 18px; font-weight: 500">Squats</span>
          <span style="font-size: 13px; color: rgba(255,255,255,0.62)">Counted by motion sensor</span>
        </span>
        <button type="button" aria-label="Squats challenge" aria-pressed="{{squatsPressed}}" onClick="{{toggleSquats}}" style="width: 64px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <span style="width: 54px; height: 32px; border-radius: 999px; padding: 3px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.16); display: flex; position: relative; transition: background .35s ease, box-shadow .35s ease; {{squatTrack}}">
            <span aria-hidden="true" style="position: absolute; inset: -1px; border-radius: 999px; pointer-events: none; {{squatRing}}"></span>
            <span style="width: 24px; height: 24px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,0.35); transform-origin: center; {{squatKnob}}"></span>
          </span>
        </button>
      </div>
      <div style="display: grid; transition: grid-template-rows .45s cubic-bezier(.2,.8,.2,1); {{squatPanel}}">
        <div style="min-height: 0; overflow: hidden">
        <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 14px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.10); {{squatInner}}">
          <div style="display: flex; align-items: center; justify-content: space-between">
            <span style="font-size: 15px; color: rgba(255,255,255,0.72)">Reps required</span>
            <div style="display: flex; align-items: center; gap: 6px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10)">
              <button type="button" aria-label="Fewer reps" onClick="{{repsDown}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.08); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
              <span style="min-width: 56px; text-align: center; font-size: 30px; font-weight: 300; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; display: inline-block; {{repsAnim}}">{{reps}}</span>
              <button type="button" aria-label="More reps" onClick="{{repsUp}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.08); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
            </div>
          </div>
          <div aria-hidden="true" style="display: flex; align-items: flex-end; justify-content: space-between; height: 30px">
            <sc-for list="{{ticks}}" as="t" hint-placeholder-count="34">
              <span style="width: 2px; border-radius: 2px; transform-origin: bottom; transition: background .2s, height .25s cubic-bezier(.34,1.56,.64,1); {{t.style}}"></span>
            </sc-for>
          </div>
          <div aria-hidden="true" style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.5); margin-top: -6px">
            <span>5</span><span>20</span><span>35</span><span>50</span>
          </div>
        </div>
        </div>
      </div>
    </section>

    <section aria-label="Math challenge" style="animation: riseIn .6s cubic-bezier(.2,.8,.2,1) 370ms backwards; margin-top: 12px; border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 0; background: linear-gradient(160deg, rgba(255,255,255,0.11), rgba(255,255,255,0.03)); border: 1px solid rgba(255,255,255,0.13); backdrop-filter: blur(26px) saturate(150%); -webkit-backdrop-filter: blur(26px) saturate(150%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16)">
      <div style="display: flex; align-items: center; gap: 14px">
        <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .35s ease, box-shadow .35s ease; {{mathIconStyle}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h5M7.5 4.5v5M14 7h5M5 16.5l4 4M9 16.5l-4 4M14 16h5M14 20h5"></path></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 18px; font-weight: 500">Math problems</span>
          <span style="font-size: 13px; color: rgba(255,255,255,0.62)">Solve to silence</span>
        </span>
        <button type="button" aria-label="Math challenge" aria-pressed="{{mathPressed}}" onClick="{{toggleMath}}" style="width: 64px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <span style="width: 54px; height: 32px; border-radius: 999px; padding: 3px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.16); display: flex; position: relative; transition: background .35s ease, box-shadow .35s ease; {{mathTrack}}">
            <span aria-hidden="true" style="position: absolute; inset: -1px; border-radius: 999px; pointer-events: none; {{mathRing}}"></span>
            <span style="width: 24px; height: 24px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,0.35); transform-origin: center; {{mathKnob}}"></span>
          </span>
        </button>
      </div>
      <div style="display: grid; transition: grid-template-rows .45s cubic-bezier(.2,.8,.2,1); {{mathPanel}}">
        <div style="min-height: 0; overflow: hidden">
        <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.10); {{mathInner}}">
          <div role="group" aria-label="Difficulty" style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10)">
            <span aria-hidden="true" style="position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 16px) / 3); border-radius: 999px; background: rgba(255,255,255,0.94); box-shadow: 0 6px 18px -8px rgba(0,0,0,0.6); transition: transform .5s cubic-bezier(.34,1.35,.64,1); {{levelSlide}}"></span>
            <sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
              <button type="button" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}" style="height: 44px; border-radius: 999px; border: 0; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; position: relative; z-index: 1; background: transparent; transition: color .3s ease; {{l.style}}">{{l.name}}</button>
            </sc-for>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between">
            <span style="font-size: 15px; color: rgba(255,255,255,0.72)">How many</span>
            <div style="display: flex; align-items: center; gap: 6px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10)">
              <button type="button" aria-label="Fewer problems" onClick="{{countDown}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.08); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
              <span style="min-width: 56px; text-align: center; font-size: 30px; font-weight: 300; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; display: inline-block; {{countAnim}}">{{count}}</span>
              <button type="button" aria-label="More problems" onClick="{{countUp}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.08); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
            </div>
          </div>
          <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{dots}}" as="dt" hint-placeholder-count="10">
              <span style="height: 6px; border-radius: 999px; transform-origin: left; transition: background .3s ease; {{dt.style}}"></span>
            </sc-for>
          </div>
        </div>
        </div>
      </div>
    </section>

    <p style="margin: 22px 8px 0; text-align: center; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,0.62)">{{summary}}</p>

    <a href="Main.dc.html" style="animation: riseIn .6s cubic-bezier(.2,.8,.2,1) 450ms backwards; margin-top: auto; height: 60px; border-radius: 999px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #FFFFFF; font-size: 17px; font-weight: 500; letter-spacing: 0.01em; background: {{fill}}; border: 1px solid rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 20px 44px -14px {{o2}}">Save alarm</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["aurora","ember","lagoon"],"default":"aurora","section":"Look"},"glow":{"editor":"range","min":0.2,"max":1,"step":0.05,"default":0.85,"section":"Look"},"texture":{"editor":"enum","options":["grain","lines","none"],"default":"grain","section":"Look"},"$preview":{"width":390,"height":1340}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      h: 6, m: 30,
      days: [false, true, true, true, true, true, false],
      squatsOn: true, mathOn: true,
      reps: 15, level: 'Medium', count: 3,
      sqT: false, mT: false, rT: false, cT: false,
      dayT: [false, false, false, false, false, false, false], dayFlips: 0, hDir: '', mDir: ''
    };
  }
  renderVals() {
    const P = {
      aurora: { o: ['#7B5CFF', '#4C8DFF', '#FF9F43'], f: ['#6D28D9', '#2563EB'] },
      ember: { o: ['#FF6A2B', '#FFB020', '#8A4DFF'], f: ['#C2410C', '#B45309'] },
      lagoon: { o: ['#2EE6C5', '#3D7BFF', '#9B5CFF'], f: ['#0F766E', '#1D4ED8'] }
    };
    const p = P[this.props.palette ?? 'aurora'] || P.aurora;
    const glow = this.props.glow ?? 0.85;
    const fill = 'linear-gradient(135deg, ' + p.f[0] + ' 0%, ' + p.f[1] + ' 100%)';
    const s = this.state;
    const pad = (n) => (n < 10 ? '0' : '') + n;
    const wrap = (n, max) => ((n % max) + max) % max;

    const trackOn = 'background: ' + fill + '; box-shadow: 0 0 18px -4px ' + p.o[1] + ', inset 0 1px 0 rgba(255,255,255,0.3)';
    const trackOff = 'background: rgba(255,255,255,0.10); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08)';
    const iconOn = 'background: ' + fill + '; box-shadow: 0 10px 24px -10px ' + p.o[1] + ', inset 0 1px 0 rgba(255,255,255,0.3)';
    const iconOff = 'background: rgba(255,255,255,0.10)';

    const now = 21 * 60 + 46;
    let diff = (s.h * 60 + s.m - now + 1440) % 1440;
    if (diff === 0) diff = 1440;
    const ringsIn = 'Rings in ' + Math.floor(diff / 60) + ' h ' + (diff % 60) + ' min';

    const names = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const letters = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    const days = s.days.map((on, i) => ({
      name: names[i], letter: letters[i], pressed: on ? 'true' : 'false',
      style: (s.dayT[i] ? 'animation: ' + (on ? 'dayOn' : 'dayOff') + ' .5s cubic-bezier(.3,1.3,.5,1) both; ' : '') + (on
        ? 'background: ' + fill + '; border: 1px solid rgba(255,255,255,0.25); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 8px 20px -8px ' + p.o[1]
        : 'background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: rgba(255,255,255,0.72)'),
      toggle: () => { const d = s.days.slice(); d[i] = !d[i]; const dt = s.dayT.slice(); dt[i] = true; this.setState({ days: d, dayT: dt, dayFlips: s.dayFlips + 1 }); }
    }));
    const k = s.days.map((on) => (on ? '1' : '0')).join('');
    const short = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    let daysLabel = s.days.map((on, i) => (on ? short[i] : null)).filter(Boolean).join(', ');
    if (k === '0111110') daysLabel = 'Weekdays';
    else if (k === '1000001') daysLabel = 'Weekends';
    else if (k === '1111111') daysLabel = 'Every day';
    else if (k === '0000000') daysLabel = 'Once';

    const N = 34;
    const lit = Math.round(((s.reps - 5) / 45) * (N - 1));
    const ticks = [];
    for (let i = 0; i < N; i++) {
      const major = i % 11 === 0 || i === N - 1;
      const isHead = i === lit;
      let st = 'height: ' + (isHead ? 30 : major ? 20 : 12) + 'px; ';
      if (isHead) st += 'background: ' + p.o[1] + '; box-shadow: 0 0 10px ' + p.o[1] + '; width: 3px';
      else if (i < lit) st += 'background: rgba(255,255,255,0.85)';
      else st += 'background: rgba(255,255,255,0.18)';
      if (s.sqT && s.squatsOn) st += '; animation: tickRise .5s cubic-bezier(.3,1.3,.5,1) ' + (120 + i * 14) + 'ms both';
      ticks.push({ style: st });
    }

    const levels = ['Easy', 'Medium', 'Hard'].map((name) => ({
      name: name, pressed: s.level === name ? 'true' : 'false',
      style: s.level === name ? 'color: #0B0B10' : 'color: rgba(255,255,255,0.72)',
      pick: () => this.setState({ level: name })
    }));
    const dots = [];
    for (let i = 0; i < 10; i++) {
      let ds = i < s.count ? 'background: ' + fill : 'background: rgba(255,255,255,0.14)';
      if (s.mT && s.mathOn) ds += '; animation: dotPop .45s cubic-bezier(.2,.8,.2,1) ' + (140 + i * 35) + 'ms both';
      dots.push({ style: ds });
    }
    const ease = 'cubic-bezier(.2,.8,.2,1)';
    const panel = (on) => (on ? 'grid-template-rows: 1fr' : 'grid-template-rows: 0fr');
    const inner = (on) => on
      ? 'opacity: 1; transform: translateY(0) scale(1); visibility: visible; transition: opacity .35s ease .1s, transform .5s ' + ease + ' .06s, visibility 0s'
      : 'opacity: 0; transform: translateY(-12px) scale(.97); visibility: hidden; transition: opacity .2s ease, transform .3s ease, visibility 0s linear .45s';
    const knob = (on, touched) => {
      if (!touched) return on ? 'transform: translateX(22px)' : 'transform: translateX(0)';
      return (on ? 'transform: translateX(22px); animation: knobOn' : 'transform: translateX(0); animation: knobOff') + ' .55s cubic-bezier(.3,1.2,.5,1) both';
    };
    const ring = (on, touched) => 'color: ' + p.o[1] + '; ' + (on && touched ? 'animation: ringOn .7s ease-out both' : 'opacity: 0');
    const iconAnim = (on, touched) => (!touched ? '' : on ? '; animation: iconPop .6s cubic-bezier(.3,1.3,.5,1) both' : '; animation: iconDrop .35s ease both');
    const levelIdx = ['Easy', 'Medium', 'Hard'].indexOf(s.level);

    const parts = [];
    if (s.squatsOn) parts.push('do ' + s.reps + ' squats');
    if (s.mathOn) parts.push('solve ' + s.count + ' ' + s.level.toLowerCase() + ' problem' + (s.count === 1 ? '' : 's'));
    const summary = parts.length
      ? 'You’ll ' + parts.join(' and ') + ' to turn this alarm off.'
      : 'No challenge — this alarm stops with a single tap.';

    return {
      o1: p.o[0], o2: p.o[1], o3: p.o[2], fill: fill,
      texGrain: (this.props.texture ?? 'grain') === 'grain', texLines: (this.props.texture ?? 'grain') === 'lines',
      glow: glow, glowLow: Math.max(0, glow - 0.3),
      hPrev: pad(wrap(s.h - 1, 24)), hNow: pad(s.h), hNext: pad(wrap(s.h + 1, 24)),
      mPrev: pad(wrap(s.m - 1, 60)), mNow: pad(s.m), mNext: pad(wrap(s.m + 1, 60)),
      hourPrev: () => this.setState({ h: wrap(s.h - 1, 24), hDir: 'Dn' }),
      hourNext: () => this.setState({ h: wrap(s.h + 1, 24), hDir: 'Up' }),
      minPrev: () => this.setState({ m: wrap(s.m - 1, 60), mDir: 'Dn' }),
      minNext: () => this.setState({ m: wrap(s.m + 1, 60), mDir: 'Up' }),
      hAnim: s.hDir ? 'animation: roll' + s.hDir + (s.h % 2 ? 'A' : 'B') + ' .4s cubic-bezier(.2,.8,.2,1) both' : '',
      mAnim: s.mDir ? 'animation: roll' + s.mDir + (s.m % 2 ? 'A' : 'B') + ' .4s cubic-bezier(.2,.8,.2,1) both' : '',
      ringsAnim: (s.hDir || s.mDir) ? 'animation: ' + ((s.h + s.m) % 2 ? 'pressBumpA' : 'pressBumpB') + ' .35s cubic-bezier(.3,1.3,.5,1) both' : '',
      daysLabelAnim: s.dayFlips ? 'animation: ' + (s.dayFlips % 2 ? 'pressBumpA' : 'pressBumpB') + ' .35s cubic-bezier(.3,1.3,.5,1) both' : '',
      ringsIn: ringsIn,
      days: days, daysLabel: daysLabel,
      squatsOn: s.squatsOn, squatsPressed: s.squatsOn ? 'true' : 'false',
      squatTrack: s.squatsOn ? trackOn : trackOff,
      squatKnob: knob(s.squatsOn, s.sqT), squatRing: ring(s.squatsOn, s.sqT),
      squatIconStyle: (s.squatsOn ? iconOn : iconOff) + iconAnim(s.squatsOn, s.sqT),
      squatPanel: panel(s.squatsOn), squatInner: inner(s.squatsOn),
      toggleSquats: () => this.setState({ squatsOn: !s.squatsOn, sqT: true }),
      repsAnim: s.rT ? 'animation: ' + (s.reps % 2 ? 'bumpA' : 'bumpB') + ' .35s cubic-bezier(.3,1.3,.5,1) both' : '',
      reps: s.reps, ticks: ticks,
      repsDown: () => this.setState({ reps: Math.max(5, s.reps - 1), rT: true }),
      repsUp: () => this.setState({ reps: Math.min(50, s.reps + 1), rT: true }),
      mathOn: s.mathOn, mathPressed: s.mathOn ? 'true' : 'false',
      mathTrack: s.mathOn ? trackOn : trackOff,
      mathKnob: knob(s.mathOn, s.mT), mathRing: ring(s.mathOn, s.mT),
      mathIconStyle: (s.mathOn ? iconOn : iconOff) + iconAnim(s.mathOn, s.mT),
      mathPanel: panel(s.mathOn), mathInner: inner(s.mathOn),
      toggleMath: () => this.setState({ mathOn: !s.mathOn, mT: true }),
      levelSlide: 'transform: translateX(calc(' + levelIdx + ' * (100% + 4px)))',
      countAnim: s.cT ? 'animation: ' + (s.count % 2 ? 'bumpA' : 'bumpB') + ' .35s cubic-bezier(.3,1.3,.5,1) both' : '',
      levels: levels, count: s.count, dots: dots,
      countDown: () => this.setState({ count: Math.max(1, s.count - 1), cT: true }),
      countUp: () => this.setState({ count: Math.min(10, s.count + 1), cT: true }),
      summary: summary
    };
  }
}
</script>
