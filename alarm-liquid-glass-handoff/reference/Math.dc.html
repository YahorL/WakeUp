<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alarm ringing — math</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#08080C}
a{color:#fff}a:hover{color:#fff}
@keyframes blink{0%,45%{opacity:1}55%,100%{opacity:0}}
@keyframes shakeA{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes shakeB{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes overlayIn{0%{opacity:0;backdrop-filter:blur(0)}100%{opacity:1}}
@keyframes iconPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes draw{0%{stroke-dashoffset:24}100%{stroke-dashoffset:0}}
@keyframes fillBar{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes riseIn{0%{opacity:0;transform:translateY(16px) scale(.98)}100%{opacity:1;transform:none}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.55}}
@keyframes pressBumpA{0%{transform:translateY(8px) scale(.9);opacity:.2}100%{transform:none;opacity:1}}
@keyframes pressBumpB{0%{transform:translateY(8px) scale(.9);opacity:.2}100%{transform:none;opacity:1}}
button:active,a:active{transform:scale(.96)!important}
button,a{transition-property:transform,background,box-shadow,color,opacity;transition-duration:.15s}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #08080C; font-family: 'Outfit', system-ui, sans-serif; color: #FFFFFF; box-sizing: border-box">

  <div aria-hidden="true" style="position: absolute; width: 460px; height: 460px; top: -120px; left: -180px; border-radius: 50%; background: radial-gradient(circle, {{o1}} 0%, transparent 66%); opacity: {{glow}}; filter: blur(10px)"></div>
  <div aria-hidden="true" style="position: absolute; width: 380px; height: 380px; top: 60px; right: -170px; border-radius: 50%; background: radial-gradient(circle, {{o2}} 0%, transparent 66%); opacity: {{glow}}; filter: blur(10px)"></div>
  <div aria-hidden="true" style="position: absolute; width: 460px; height: 460px; bottom: -220px; right: -120px; border-radius: 50%; background: radial-gradient(circle, {{o3}} 0%, transparent 66%); opacity: {{glowLow}}; filter: blur(14px)"></div>
  <sc-if value="{{texGrain}}" hint-placeholder-val="{{ true }}">
    <svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; opacity: 0.22; mix-blend-mode: overlay; pointer-events: none"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
  </sc-if>
  <sc-if value="{{texLines}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 14px); -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 60%); mask-image: linear-gradient(180deg, #000 0%, transparent 60%)"></div>
  </sc-if>

  <div style="position: relative; display: flex; flex-direction: column; padding: 56px 20px 30px; box-sizing: border-box; height: 100%">

    <div style="display: flex; align-items: center; justify-content: space-between; animation: riseIn .6s cubic-bezier(.2,.8,.2,1) 0ms backwards">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.62)">Wake up · 06:30</span>
        <h1 style="margin: 0; font-size: 22px; font-weight: 400; letter-spacing: -0.01em">Problem 3 of 3</h1>
      </div>
      <span style="padding: 8px 14px; border-radius: 999px; font-size: 13px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14)">Medium</span>
    </div>

    <div aria-hidden="true" style="margin-top: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <span style="height: 5px; border-radius: 999px; background: {{fill}}"></span>
      <span style="height: 5px; border-radius: 999px; background: {{fill}}"></span>
      <span style="height: 5px; border-radius: 999px; background: {{fill}}"></span>
      <span style="height: 5px; border-radius: 999px; position: relative; overflow: hidden; background: linear-gradient(90deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0.16) 50%)"><sc-if value="{{solved}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; inset: 0; border-radius: 999px; background: {{fill}}; transform-origin: left; animation: fillBar .6s cubic-bezier(.2,.8,.2,1) both"></span></sc-if></span>
    </div>
    <div aria-hidden="true" style="margin-top: 6px; display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.5)">
      <span>Squats ✓</span><span>Math</span>
    </div>

    <section aria-label="Problem" style="animation: riseIn .7s cubic-bezier(.2,.8,.2,1) 80ms backwards; margin-top: 22px; border-radius: 30px; padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 14px; background: linear-gradient(160deg, rgba(255,255,255,0.13) 0%, rgba(255,255,255,0.035) 60%, rgba(255,255,255,0.06) 100%); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 30px 60px -30px rgba(0,0,0,0.7)">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.62)">Solve to silence</span>
      <div style="font-size: 46px; font-weight: 300; letter-spacing: -0.03em; line-height: 1.05; font-variant-numeric: tabular-nums">47 × 6 + 18</div>
      <div style="height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0.25), rgba(255,255,255,0))"></div>
      <div aria-live="polite" style="display: flex; align-items: center; gap: 12px; min-height: 64px; {{shakeStyle}}">
        <span style="font-size: 40px; font-weight: 200; color: rgba(255,255,255,0.5)">=</span>
        <span style="font-size: 60px; font-weight: 200; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; display: inline-block; transition: color .2s; {{answerStyle}}">{{display}}</span>
        <span aria-hidden="true" style="width: 2px; height: 48px; border-radius: 2px; background: {{o2}}; box-shadow: 0 0 10px {{o2}}; animation: blink 1.05s steps(1) infinite"></span>
      </div>
      <sc-if value="{{wrong}}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 14px; color: #FFB4B4; animation: riseIn .35s cubic-bezier(.2,.8,.2,1) backwards">Not quite — try again</span>
      </sc-if>
    </section>

    <div role="group" aria-label="Keypad" style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
        <button type="button" aria-label="{{k.aria}}" onClick="{{k.press}}" style="height: 66px; border-radius: 22px; font-family: inherit; font-size: 30px; font-weight: 300; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%); {{k.style}}; {{k.enter}}">
          <sc-if value="{{k.isDigit}}" hint-placeholder-val="{{ true }}">{{k.label}}</sc-if>
          <sc-if value="{{k.isDel}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7z"></path><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"></path></svg></sc-if>
          <sc-if value="{{k.isOk}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
        </button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{solved}}" hint-placeholder-val="{{ false }}">
    <div style="animation: overlayIn .5s ease both; position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 30px; box-sizing: border-box; background: rgba(8,8,12,0.55); backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%)">
      <span aria-hidden="true" style="animation: iconPop .7s cubic-bezier(.3,1.3,.5,1) .1s both; width: 120px; height: 120px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{fill}}; border: 1px solid rgba(255,255,255,0.25); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 30px 70px -20px {{o2}}">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-dasharray="24" style="animation: draw .5s ease-out .55s both"></path></svg>
      </span>
      <h2 style="animation: riseIn .5s cubic-bezier(.2,.8,.2,1) .45s backwards; margin: 10px 0 0; font-size: 34px; font-weight: 300; letter-spacing: -0.02em">Alarm off</h2>
      <p style="animation: riseIn .5s cubic-bezier(.2,.8,.2,1) .55s backwards; margin: 0; font-size: 15px; color: rgba(255,255,255,0.72); text-align: center">15 squats and 3 problems done. Good morning.</p>
      <a href="Main.dc.html" style="animation: riseIn .5s cubic-bezier(.2,.8,.2,1) .65s backwards; margin-top: 18px; height: 56px; padding: 0 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #0B0B10; font-size: 16px; font-weight: 500; background: rgba(255,255,255,0.94)">Back to alarms</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["aurora","ember","lagoon"],"default":"aurora","section":"Look"},"glow":{"editor":"range","min":0.2,"max":1,"step":0.05,"default":0.85,"section":"Look"},"texture":{"editor":"enum","options":["grain","lines","none"],"default":"grain","section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { input: '3', wrong: false, solved: false, typed: 0, misses: 0 };
  }
  renderVals() {
    const P = {
      aurora: { o: ['#7B5CFF', '#4C8DFF', '#FF9F43'], f: ['#6D28D9', '#2563EB'] },
      ember: { o: ['#FF6A2B', '#FFB020', '#8A4DFF'], f: ['#C2410C', '#B45309'] },
      lagoon: { o: ['#2EE6C5', '#3D7BFF', '#9B5CFF'], f: ['#0F766E', '#1D4ED8'] }
    };
    const p = P[this.props.palette ?? 'aurora'] || P.aurora;
    const glow = this.props.glow ?? 0.85;
    const fill = 'linear-gradient(135deg, ' + p.f[0] + ' 0%, ' + p.f[1] + ' 100%)';
    const s = this.state;
    const glass = 'background: linear-gradient(160deg, rgba(255,255,255,0.12), rgba(255,255,255,0.035)); border: 1px solid rgba(255,255,255,0.13); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16)';
    const press = (kind, val) => () => {
      if (kind === 'digit') {
        if (s.input.length < 5) this.setState({ input: s.input + val, wrong: false, typed: s.typed + 1 });
      } else if (kind === 'del') {
        this.setState({ input: s.input.slice(0, -1), wrong: false, typed: s.typed + 1 });
      } else if (kind === 'ok') {
        if (s.input === '300') this.setState({ solved: true, wrong: false });
        else this.setState({ wrong: true, misses: s.misses + 1 });
      }
    };
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'];
    const keys = labels.map((l, i) => {
      const kind = l === 'del' ? 'del' : l === 'ok' ? 'ok' : 'digit';
      return {
        label: l,
        isDigit: kind === 'digit', isDel: kind === 'del', isOk: kind === 'ok',
        aria: kind === 'del' ? 'Delete' : kind === 'ok' ? 'Submit answer' : l,
        style: kind === 'ok'
          ? 'background: ' + fill + '; border: 1px solid rgba(255,255,255,0.25); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 16px 34px -14px ' + p.o[1]
          : kind === 'del' ? 'background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08)' : glass,
        enter: 'animation: riseIn .5s cubic-bezier(.2,.8,.2,1) ' + (200 + i * 30) + 'ms backwards',
        press: press(kind, l)
      };
    });
    return {
      o1: p.o[0], o2: p.o[1], o3: p.o[2], fill: fill,
      texGrain: (this.props.texture ?? 'grain') === 'grain', texLines: (this.props.texture ?? 'grain') === 'lines',
      glow: glow, glowLow: Math.max(0, glow - 0.25),
      display: s.input === '' ? '?' : s.input,
      answerStyle: s.wrong ? 'color: #FFB4B4' : s.input === '' ? 'color: rgba(255,255,255,0.35)' : 'color: #FFFFFF',
      wrong: s.wrong, solved: s.solved,
      lastBar: s.solved ? 'background: ' + fill : 'background: linear-gradient(90deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0.16) 50%)',
      keys: keys,
      shakeStyle: s.wrong ? 'animation: ' + (s.misses % 2 ? 'shakeA' : 'shakeB') + ' .45s ease both' : ''
    };
  }
}
</script>
</body>
</html>
