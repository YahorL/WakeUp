<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alarms</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#08080C}
a{color:#fff}a:hover{color:#fff}
@keyframes knobOn{0%{transform:translateX(0) scaleX(1)}45%{transform:translateX(9px) scaleX(1.42)}75%{transform:translateX(24px) scaleX(.92)}100%{transform:translateX(22px) scaleX(1)}}
@keyframes knobOff{0%{transform:translateX(22px) scaleX(1)}45%{transform:translateX(13px) scaleX(1.42)}75%{transform:translateX(-2px) scaleX(.92)}100%{transform:translateX(0) scaleX(1)}}
@keyframes ringOn{0%{box-shadow:0 0 0 0 currentColor;opacity:.75}100%{box-shadow:0 0 0 14px currentColor;opacity:0}}
@keyframes riseIn{0%{opacity:0;transform:translateY(16px) scale(.98)}100%{opacity:1;transform:none}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.55}}
@keyframes pressBumpA{0%{transform:translateY(8px) scale(.9);opacity:.2}100%{transform:none;opacity:1}}
@keyframes pressBumpB{0%{transform:translateY(8px) scale(.9);opacity:.2}100%{transform:none;opacity:1}}
button:active,a:active{transform:scale(.96)!important}
button,a{transition-property:transform,background,box-shadow,color,opacity;transition-duration:.15s}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #08080C; font-family: 'Outfit', system-ui, sans-serif; color: #FFFFFF; box-sizing: border-box">

  <div aria-hidden="true" style="position: absolute; width: 420px; height: 420px; top: -170px; left: -150px; border-radius: 50%; background: radial-gradient(circle, {{o1}} 0%, transparent 66%); opacity: {{glow}}; filter: blur(10px)"></div>
  <div aria-hidden="true" style="position: absolute; width: 360px; height: 360px; top: 150px; right: -190px; border-radius: 50%; background: radial-gradient(circle, {{o2}} 0%, transparent 66%); opacity: {{glow}}; filter: blur(10px)"></div>
  <div aria-hidden="true" style="position: absolute; width: 460px; height: 460px; bottom: -260px; left: -60px; border-radius: 50%; background: radial-gradient(circle, {{o3}} 0%, transparent 66%); opacity: {{glowLow}}; filter: blur(14px)"></div>
  <sc-if value="{{texGrain}}" hint-placeholder-val="{{ true }}">
    <svg aria-hidden="true" width="100%" height="100%" style="position: absolute; inset: 0; opacity: 0.22; mix-blend-mode: overlay; pointer-events: none"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
  </sc-if>
  <sc-if value="{{texLines}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 14px); -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 60%); mask-image: linear-gradient(180deg, #000 0%, transparent 60%)"></div>
  </sc-if>

  <div style="position: relative; display: flex; flex-direction: column; padding: 52px 20px 0; box-sizing: border-box; height: 100%">

    <div style="display: flex; align-items: flex-start; justify-content: space-between; animation: riseIn .6s cubic-bezier(.2,.8,.2,1) 0ms backwards">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 36px; font-weight: 400; letter-spacing: -0.03em; line-height: 1.05">Alarms</h1>
        <p style="margin: 0; font-size: 14px; color: rgba(255,255,255,0.62)">{{countLine}}</p>
      </div>
      <button type="button" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; background: linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04)); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18)">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      </button>
    </div>

    <section aria-label="Next alarm" style="animation: riseIn .7s cubic-bezier(.2,.8,.2,1) 90ms backwards; margin-top: 22px; border-radius: 30px; padding: 20px; display: flex; flex-direction: column; gap: 14px; background: linear-gradient(160deg, rgba(255,255,255,0.13) 0%, rgba(255,255,255,0.035) 60%, rgba(255,255,255,0.06) 100%); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 30px 60px -30px rgba(0,0,0,0.7)">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 3px">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.62)">Next alarm</span>
          <span style="font-size: 15px; font-weight: 500">Wake up · Weekdays</span>
        </div>
        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; font-size: 13px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14)">
          <span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: {{o2}}; box-shadow: 0 0 10px {{o2}}; animation: breathe 2.4s ease-in-out infinite"></span>
          in 8 h 44 min
        </span>
      </div>
      <div style="font-size: 96px; font-weight: 200; letter-spacing: -0.05em; line-height: 0.95; font-variant-numeric: tabular-nums">06:30</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 18px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10)">
          <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: {{fill}}; flex-shrink: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"></path></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
            <span style="font-size: 15px; font-weight: 500">15 squats</span>
            <span style="font-size: 12px; color: rgba(255,255,255,0.62)">Motion sensor</span>
          </span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 18px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10)">
          <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.12); flex-shrink: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h5M7.5 4.5v5M14 7h5M5 16.5l4 4M9 16.5l-4 4M14 16h5M14 20h5"></path></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
            <span style="font-size: 15px; font-weight: 500">3 problems</span>
            <span style="font-size: 12px; color: rgba(255,255,255,0.62)">Medium</span>
          </span>
        </div>
      </div>
    </section>

    <div style="margin-top: 26px; display: flex; align-items: center; justify-content: space-between; animation: riseIn .6s cubic-bezier(.2,.8,.2,1) 180ms backwards">
      <h2 style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.62)">All alarms</h2>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.62); display: inline-block; {{countAnim}}">{{activeCount}} / 3 on</span>
    </div>

    <ul style="list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{alarms}}" as="a" hint-placeholder-count="3">
        <li style="display: flex; align-items: center; gap: 14px; padding: 12px 8px 12px 18px; border-radius: 24px; background: linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03)); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.14); {{a.enter}}">
          <a href="Editor.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; text-decoration: none; color: #fff; transition: opacity .4s ease; {{a.dimStyle}}">
            <span style="font-size: 38px; font-weight: 200; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums">{{a.time}}</span>
            <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <span style="font-size: 15px; font-weight: 500">{{a.label}}</span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.62)">
                {{a.days}}
                <sc-if value="{{a.squats}}" hint-placeholder-val="{{ true }}">
                  <span aria-label="Squats" role="img" style="display: inline-flex; width: 18px; height: 18px; border-radius: 6px; align-items: center; justify-content: center; background: rgba(255,255,255,0.12)"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6"></path></svg></span>
                </sc-if>
                <sc-if value="{{a.math}}" hint-placeholder-val="{{ true }}">
                  <span aria-label="Math" role="img" style="display: inline-flex; width: 18px; height: 18px; border-radius: 6px; align-items: center; justify-content: center; background: rgba(255,255,255,0.12)"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M12 5v14"></path></svg></span>
                </sc-if>
              </span>
            </span>
          </a>
          <button type="button" aria-label="{{a.aria}}" aria-pressed="{{a.pressed}}" onClick="{{a.toggle}}" style="width: 64px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <span style="width: 54px; height: 32px; border-radius: 999px; padding: 3px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.16); display: flex; position: relative; transition: background .35s ease, box-shadow .35s ease; {{a.trackStyle}}">
              <span aria-hidden="true" style="position: absolute; inset: -1px; border-radius: 999px; pointer-events: none; {{a.ringStyle}}"></span>
              <span style="width: 24px; height: 24px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,0.35); {{a.knobStyle}}"></span>
            </span>
          </button>
        </li>
      </sc-for>
    </ul>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(180deg, rgba(8,8,12,0) 0%, rgba(8,8,12,0.92) 60%)"></div>
  <a href="Editor.dc.html" style="animation: riseIn .7s cubic-bezier(.2,.8,.2,1) 420ms backwards; position: absolute; left: 20px; right: 20px; bottom: 30px; height: 60px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: #FFFFFF; font-size: 17px; font-weight: 500; letter-spacing: 0.01em; background: {{fill}}; border: 1px solid rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 20px 44px -14px {{o2}}">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    New alarm
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["aurora","ember","lagoon"],"default":"aurora","section":"Look"},"glow":{"editor":"range","min":0.2,"max":1,"step":0.05,"default":0.85,"section":"Look"},"texture":{"editor":"enum","options":["grain","lines","none"],"default":"grain","section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { a1: true, a2: false, a3: true }, t: {}, flips: 0 };
  }
  renderVals() {
    const P = {
      aurora: { o: ['#7B5CFF', '#4C8DFF', '#FF9F43'], f: ['#6D28D9', '#2563EB'] },
      ember: { o: ['#FF6A2B', '#FFB020', '#8A4DFF'], f: ['#C2410C', '#B45309'] },
      lagoon: { o: ['#2EE6C5', '#3D7BFF', '#9B5CFF'], f: ['#0F766E', '#1D4ED8'] }
    };
    const p = P[this.props.palette ?? 'aurora'] || P.aurora;
    const glow = this.props.glow ?? 0.85;
    const fill = 'linear-gradient(135deg, ' + p.f[0] + ' 0%, ' + p.f[1] + ' 100%)';
    const data = [
      { id: 'a1', time: '06:30', label: 'Wake up', days: 'Mon – Fri', squats: true, math: true },
      { id: 'a2', time: '08:30', label: 'Weekend', days: 'Sat, Sun', squats: false, math: true },
      { id: 'a3', time: '17:45', label: 'Gym', days: 'Tue, Thu', squats: true, math: false }
    ];
    const on = this.state.on;
    const t = this.state.t;
    const alarms = data.map((a, i) => {
      const isOn = !!on[a.id];
      const touched = !!t[a.id];
      return Object.assign({}, a, {
        pressed: isOn ? 'true' : 'false',
        aria: (isOn ? 'Turn off ' : 'Turn on ') + a.label + ' alarm at ' + a.time,
        dimStyle: isOn ? 'opacity: 1' : 'opacity: 0.45',
        trackStyle: isOn
          ? 'background: ' + fill + '; box-shadow: 0 0 18px -4px ' + p.o[1] + ', inset 0 1px 0 rgba(255,255,255,0.3)'
          : 'background: rgba(255,255,255,0.10); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08)',
        knobStyle: !touched ? (isOn ? 'transform: translateX(22px)' : 'transform: translateX(0)')
          : (isOn ? 'transform: translateX(22px); animation: knobOn' : 'transform: translateX(0); animation: knobOff') + ' .55s cubic-bezier(.3,1.2,.5,1) both',
        ringStyle: 'color: ' + p.o[1] + '; ' + (isOn && touched ? 'animation: ringOn .7s ease-out both' : 'opacity: 0'),
        enter: 'animation: riseIn .6s cubic-bezier(.2,.8,.2,1) ' + (240 + i * 80) + 'ms backwards',
        toggle: () => this.setState({ on: Object.assign({}, on, { [a.id]: !isOn }), t: Object.assign({}, t, { [a.id]: true }), flips: this.state.flips + 1 })
      });
    });
    const activeCount = alarms.filter((a) => on[a.id]).length;
    return {
      o1: p.o[0], o2: p.o[1], o3: p.o[2], fill: fill,
      texGrain: (this.props.texture ?? 'grain') === 'grain', texLines: (this.props.texture ?? 'grain') === 'lines',
      glow: glow, glowLow: Math.max(0, glow - 0.25),
      alarms: alarms,
      activeCount: activeCount,
      countAnim: this.state.flips ? 'animation: ' + (this.state.flips % 2 ? 'pressBumpA' : 'pressBumpB') + ' .35s cubic-bezier(.3,1.3,.5,1) both' : '',
      countLine: activeCount === 0 ? 'No upcoming alarms' : activeCount + ' active · next at 06:30'
    };
  }
}
</script>
</body>
</html>
